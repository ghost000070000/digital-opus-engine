<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{PAGE_TITLE}}</title>
<meta name="description" content="{{PAGE_DESCRIPTION}}">
<meta name="theme-color" content="#0c1420">
<link rel="icon" type="image/png" href="assets/branding/digital-opus-icon.png">
<link rel="apple-touch-icon" href="assets/branding/digital-opus-icon.png">
<!-- Generated by build/build-games-site.js (or build/build-engine-site.js,
     for the Engine's own examples subpage) from build/templates/games-site.html
     and games/catalog.json. Do not edit this file directly -- edit the
     template, the catalog, or a game's own project JSON, then regenerate. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0c1420; color: #e6ecf7; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: inherit; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header.site-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.08);
  }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: 0.01em; text-decoration: none; }
  .brand span { color: #6fd6bd; }
  nav.site-nav { display: flex; gap: 20px; }
  nav.site-nav a { font-size: 13.5px; color: #aab6cc; text-decoration: none; padding: 4px 2px; }
  nav.site-nav a:hover, nav.site-nav a:focus-visible { color: #e6ecf7; }

  /* Hero */
  .hero { text-align: center; padding: 56px 20px 40px; }
  .hero h1 { margin: 0 0 12px; font-size: clamp(28px, 5vw, 42px); letter-spacing: 0.01em; }
  .hero p { margin: 0 auto; max-width: 520px; color: #aab6cc; font-size: 15.5px; }
  .hero .actions { display: flex; gap: 12px; justify-content: center; margin-top: 26px; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 11px 22px; border-radius: 7px; font-size: 14px; font-weight: 600; text-decoration: none; border: 1px solid transparent; }
  .btn-primary { background: #6fd6bd; color: #0c1420; }
  .btn-primary:hover, .btn-primary:focus-visible { background: #85e0c9; }
  .btn-secondary { background: transparent; color: #c7d3ea; border-color: rgba(255,255,255,0.18); }
  .btn-secondary:hover, .btn-secondary:focus-visible { border-color: #6fd6bd; color: #e6ecf7; }
  a.btn:focus-visible, button:focus-visible, .card:focus-visible, .filters button:focus-visible { outline: 2px solid #6fd6bd; outline-offset: 2px; }

  /* Filters */
  .filters { display: flex; gap: 8px; justify-content: center; margin: 8px 0 32px; flex-wrap: wrap; }
  .filters button { background: #182338; color: #c7d3ea; border: 1px solid rgba(255,255,255,0.12); border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
  .filters button.active { background: #6fd6bd; color: #0c1420; border-color: #6fd6bd; font-weight: 600; }

  /* Sections */
  main { padding-bottom: 56px; }
  section.games-section { margin-top: 12px; }
  section.games-section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #8fa3c9; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; margin: 0 0 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
  .grid.grid-compact { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .games-empty-notice { text-align: center; color: #8fa3c9; font-size: 15px; padding: 48px 16px; border: 1px dashed rgba(255,255,255,0.12); border-radius: 12px; }

  /* Cards */
  .card { display: flex; flex-direction: column; background: #182338; border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit; transition: border-color 0.15s, transform 0.15s; }
  .card:hover, .card:focus-visible { border-color: #6fd6bd; }
  .card-thumb { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; background: #0f1626; }
  .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
  .card-title-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
  .card-title { font-size: 15.5px; font-weight: 700; }
  .card-badge { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.05em; color: #0c1420; background: #6fd6bd; padding: 2px 7px; border-radius: 3px; flex-shrink: 0; }
  .card-genre { font-size: 11.5px; color: #8fa3c9; margin-top: 3px; }
  .card-desc { font-size: 12.5px; color: #aab6cc; margin-top: 8px; line-height: 1.5; flex: 1; }
  .card-meta-row { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .card-meta { font-size: 11px; color: #66759a; }
  .card-play { font-size: 12.5px; font-weight: 700; color: #6fd6bd; }
  .card-footer { display: flex; gap: 10px; margin-top: 8px; }
  .card-download { font-size: 10.5px; color: #66759a; text-decoration: none; }
  .card-download:hover, .card-download:focus-visible { color: #aab6cc; }
  .card.card-compact .card-body { padding: 12px 14px 14px; }
  .card.card-compact .card-title { font-size: 13.5px; }
  .card.card-compact .card-desc { font-size: 11.5px; }

  /* About */
  .about { max-width: 640px; margin: 48px auto 0; padding: 0 20px; text-align: center; color: #aab6cc; font-size: 13.5px; }
  .about h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; color: #8fa3c9; margin-bottom: 10px; }

  footer.site-footer { text-align: center; padding: 24px 20px 40px; color: #66759a; font-size: 12px; }

  [hidden] { display: none !important; }

  @media (max-width: 640px) {
    header.site-header { flex-direction: column; gap: 10px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); }
  }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="{{HOME_HREF}}">{{BRAND_HTML}}</a>
  <nav class="site-nav" aria-label="Site">
    {{NAV_HOME_LINK}}
    {{FEATURED_NAV}}
    <a href="#more">{{NAV_MORE_LABEL}}</a>
    <a href="#about">About</a>
  </nav>
</header>

<div class="hero" id="top">
  <h1>{{HERO_TITLE}}</h1>
  <p>{{HERO_SUBTITLE}}</p>
  <div class="actions">
    <a class="btn btn-primary" href="#{{BROWSE_TARGET}}">{{PRIMARY_CTA}}</a>
    {{FEATURED_CTA}}
  </div>
</div>

<div class="filters" role="group" aria-label="Filter games by category">
  <button type="button" class="active" data-filter="all">All</button>
  {{FEATURED_FILTER}}
  {{SAMPLE_FILTER}}
</div>

<main class="wrap">
{{FEATURED_SECTION}}
{{MORE_SECTION}}
</main>

<div class="about" id="about">
  <h2>About</h2>
  <p>{{ABOUT_TEXT}}</p>
</div>

<footer class="site-footer">
  <p>{{GAME_COUNT}} games &middot; made with Digital Opus Engine</p>
</footer>

<script>
document.querySelectorAll('.filters button').forEach(function (btn) {
  btn.addEventListener('click', function () {
    document.querySelectorAll('.filters button').forEach(function (b) { b.classList.remove('active'); });
    btn.classList.add('active');
    var filter = btn.dataset.filter;
    document.querySelectorAll('main [data-category]').forEach(function (card) {
      var cat = card.dataset.category;
      var show = filter === 'all' || cat === filter;
      card.hidden = !show;
    });
    document.querySelectorAll('main section.games-section').forEach(function (sec) {
      var anyVisible = Array.prototype.some.call(sec.querySelectorAll('[data-category]'), function (c) { return !c.hidden; });
      sec.hidden = !anyVisible;
    });
  });
});
</script>
</body>
</html>
